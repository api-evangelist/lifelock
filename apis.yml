aid: lifelock
name: LifeLock
description: 'LifeLock is a consumer identity-theft-protection brand founded in 2005
  in Tempe, Arizona and owned by Gen Digital, Inc. (Nasdaq: GEN). It monitors members''
  personal information — Social Security numbers, names, addresses, credit applications
  and public records — for signs of misuse, alerts them through its proprietary Identity
  Alert System, and provides U.S.-based restoration specialists plus reimbursement
  coverage when identity theft occurs. Current plans (Core, Advanced, Total) layer
  on credit-bureau monitoring, dark-web monitoring, automatic data-broker removal,
  scam support and reimbursement, home-title and SIM-swap monitoring, and the Million
  Dollar Protection Package. LifeLock is also sold bundled with Norton device security
  as Norton 360 with LifeLock. It is a direct-to-consumer subscription service and
  publishes no public developer API, SDKs, or developer portal; its machine-readable
  surface is a first-party llms.txt at lifelock.norton.com.'
